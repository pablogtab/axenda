name: CI/CD Deploy Axenda

on:
  push:
    branches: [ master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backoffice: ${{ steps.filter.outputs.admin_backoffice }}
      services: ${{ steps.set-matrix.outputs.services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check path changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'
            admin_backoffice:
              - 'admin_backoffice/**'
              - '.github/workflows/deploy.yml'

      - name: Generate matrix
        id: set-matrix
        run: |
          SERVICES='[]'
          if [ "${{ steps.filter.outputs.backend }}" = "true" ]; then
            SERVICES=$(echo $SERVICES | jq -c '. + ["backend"]')
          fi
          if [ "${{ steps.filter.outputs.frontend }}" = "true" ]; then
            SERVICES=$(echo $SERVICES | jq -c '. + ["frontend"]')
          fi
          if [ "${{ steps.filter.outputs.admin_backoffice }}" = "true" ]; then
            SERVICES=$(echo $SERVICES | jq -c '. + ["backoffice"]')
          fi
          echo "services=$SERVICES" >> $GITHUB_OUTPUT

  build-and-push:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service == 'backoffice' && 'admin_backoffice' || matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [detect-changes, build-and-push]
    if: ${{ always() && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') && needs.detect-changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/opt/axenda"

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: BACKEND_CHANGED
          script: |
            cd /opt/axenda
            
            # Login en GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pullear nuevas imágenes y levantar con nombre de proyecto específico
            docker compose -p axenda-app pull
            docker compose -p axenda-app up -d --remove-orphans
            
            # Ejecutar migraciones de Prisma únicamente si cambió el backend
            if [ "$BACKEND_CHANGED" = "true" ]; then
              docker exec axenda_backend npx prisma migrate deploy --schema ./prisma/schema/schema.prisma
              docker exec axenda_backend npx prisma db seed
            fi
            
            # Limpieza de imágenes huérfanas
            docker image prune -f
        env:
          BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
