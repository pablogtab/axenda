services:
  postgres:
    image: postgres:16-alpine
    container_name: axenda_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axenda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axenda_secret}
      POSTGRES_DB: ${POSTGRES_DB:-axenda_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axenda} -d ${POSTGRES_DB:-axenda_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - axenda-network

  redis:
    image: redis:7-alpine
    container_name: axenda_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - axenda-network

  backend:
    image: ghcr.io/pablogtab/axenda-backend:latest
    container_name: axenda_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-axenda}:${POSTGRES_PASSWORD:-axenda_secret}@postgres:5432/${POSTGRES_DB:-axenda_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - axenda-network

  frontend:
    image: ghcr.io/pablogtab/axenda-frontend:latest
    container_name: axenda_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - axenda-network

volumes:
  postgres_data:
  redis_data:

networks:
  axenda-network:
    external: true
