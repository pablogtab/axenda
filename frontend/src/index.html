<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Axenda - Sistema de Turnos</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script>
      (function() {
        // Global error handling for early detection
        window.onerror = function(msg, url, lineNo, columnNo, error) {
          console.error('Global error:', msg, 'at', url, ':', lineNo, ':', columnNo, error);
          return false;
        };

        window.onunhandledrejection = function(event) {
          console.error('Unhandled promise rejection:', event.reason);
        };

        // Detect asset loading failures
        window.addEventListener('error', function(e) {
          if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
            console.error('Asset load failed:', e.target.src || e.target.href);
          }
        }, true);

        try {
          const theme = localStorage.getItem('axenda-theme') || 'dark';
          document.documentElement.classList.add(theme);
        } catch (e) {
          console.error('Theme initialization failed', e);
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
