<div class="space-y-2">
  @if (label) {
    <label class="text-xs font-bold text-text-dim uppercase tracking-wider block">
      {{ label }}
    </label>
  }
  
  <div class="relative group">
    <input type="text"
           [formControl]="control"
           [placeholder]="placeholder"
           (blur)="onBlur()"
           maxlength="5"
           inputmode="numeric"
           class="w-full bg-surface-subtle border border-border rounded-xl px-4 py-2 text-sm text-text-main focus:ring-2 focus:ring-primary/50 outline-none transition-all placeholder:text-text-dim/30">
    
    <!-- Icono decorativo de reloj -->
    <div class="absolute right-4 top-2.5 text-text-dim/50 group-focus-within:text-primary transition-colors pointer-events-none">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>
  </div>
</div>
