<div class="flex flex-col gap-2">
  <label class="text-sm font-medium text-gray-700 dark:text-gray-300">{{ label }}</label>
  
  <div 
    (click)="fileInput.click()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
    [class.dragging]="isDragging"
    [class.circle]="shape === 'circle'"
    [class.square]="shape === 'square'"
    class="relative cursor-pointer group overflow-hidden border-2 border-dashed transition-all duration-300
           flex items-center justify-center bg-gray-50 dark:bg-gray-900/50 
           hover:bg-gray-100 dark:hover:bg-gray-800/80
           border-gray-300 dark:border-gray-700 hover:border-primary-500"
    [ngClass]="dimensions"
  >
    <!-- Hidden Input -->
    <input 
      #fileInput 
      type="file" 
      class="hidden" 
      accept="image/*" 
      (change)="onFileSelected($event)"
    >

    <!-- Background Image / Preview -->
    <img 
      *ngIf="previewUrl || currentImageUrl" 
      [src]="(previewUrl || currentImageUrl) | storage" 
      class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
      [class.opacity-40]="isUploading"
    >

    <!-- Empty State -->
    <div 
      *ngIf="!previewUrl && !currentImageUrl && !isUploading"
      class="flex flex-col items-center gap-2 text-gray-400 group-hover:text-primary-500 transition-colors"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      <span class="text-xs font-medium">Subir foto</span>
    </div>

    <!-- Uploading Overlay -->
    <div 
      *ngIf="isUploading"
      class="absolute inset-0 flex flex-col items-center justify-center bg-black/20 backdrop-blur-[2px]"
    >
      <div class="relative w-16 h-16 flex items-center justify-center">
        <!-- Progress Ring -->
        <svg class="w-full h-full -rotate-90">
          <circle 
            cx="32" cy="32" r="28" 
            class="stroke-gray-200/30 fill-none" 
            stroke-width="4"
          />
          <circle 
            cx="32" cy="32" r="28" 
            class="stroke-white fill-none transition-all duration-300" 
            stroke-width="4"
            [style.strokeDasharray]="175.9"
            [style.strokeDashoffset]="175.9 - (175.9 * uploadProgress / 100)"
          />
        </svg>
        <span class="absolute text-xs font-bold text-white">{{ uploadProgress }}%</span>
      </div>
    </div>

    <!-- Hover Controls -->
    <div 
      *ngIf="(previewUrl || currentImageUrl) && !isUploading"
      class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-3"
    >
      <button 
        type="button"
        (click)="$event.stopPropagation(); fileInput.click()"
        class="p-2 bg-white/20 hover:bg-white/40 rounded-full text-white backdrop-blur-sm transition-colors"
        title="Cambiar imagen"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
        </svg>
      </button>
      <button 
        type="button"
        (click)="removeImage($event)"
        class="p-2 bg-red-500/20 hover:bg-red-500/40 rounded-full text-red-200 backdrop-blur-sm transition-colors"
        title="Eliminar imagen"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      </button>
    </div>
  </div>
</div>
