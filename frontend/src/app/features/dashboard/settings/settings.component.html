<div class="h-full flex flex-col p-2 md:p-4 overflow-hidden bg-bg-primary">
    <div class="mb-4 flex justify-between items-start">
        <div>
            <h1 class="text-2xl font-bold text-text-main tracking-tight">Configuración del Negocio</h1>
            <p class="text-text-muted text-sm mt-1">Gestiona los detalles y preferencias de tu negocio.</p>
        </div>
        <app-theme-toggle [showLabels]="true" />
    </div>

    <div class="flex-1 flex flex-col md:flex-row gap-4 overflow-hidden">
        <!-- Section Sidebar / Menu -->
        <aside class="w-full md:w-64 shrink-0 grid grid-cols-4 md:flex md:flex-col gap-2 md:gap-1 overflow-y-auto custom-scrollbar md:pr-2 pb-2 md:pb-0">
            <button
                *ngFor="let section of sections"
                (click)="setActiveSection(section.id)"
                [class.bg-surface-subtle-hover]="activeSection === section.id"
                [class.text-text-main]="activeSection === section.id"
                [class.border-b-4]="activeSection === section.id"
                [class.md:border-b-0]="activeSection === section.id"
                [class.md:border-l-4]="activeSection === section.id"
                [class.border-primary]="activeSection === section.id"
                class="flex flex-col md:flex-row items-center gap-1 md:gap-3 p-2 md:p-3 rounded-xl text-text-muted font-medium transition-all hover:bg-surface-subtle hover:text-text-main text-center md:text-left group border-b-4 md:border-b-0 md:border-l-4 border-transparent shrink-0">
                <div class="w-5 h-5 flex items-center justify-center transition-transform group-hover:scale-110 shrink-0">
                    <app-icon *ngIf="section.id !== 'whatsapp'" name="{{ section.icon }}" class="text-base md:text-base"></app-icon>
                    <svg *ngIf="section.id === 'whatsapp'" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L0 24l6.335-1.662c1.746.953 3.71 1.455 5.703 1.455h.008c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
                    </svg>
                </div>
                <div class="flex flex-col min-w-0">
                    <span class="font-bold truncate text-[10px] md:text-sm">{{ section.title }}</span>
                    <span class="text-[10px] opacity-60 truncate hidden md:block">{{ section.description }}</span>
                </div>
            </button>
        </aside>

        <!-- Content Area -->
        <main class="flex-1 glass rounded-2xl overflow-hidden flex flex-col border border-border">
            <div class="h-full custom-scrollbar"
                [class.overflow-y-auto]="activeSection !== 'public-site'"
                [class.overflow-hidden]="activeSection === 'public-site'"
                [class.flex]="activeSection === 'public-site'"
                [class.flex-col]="activeSection === 'public-site'"
                [class.p-4]="!['professionals', 'branches', 'services'].includes(activeSection)"
                [class.md:p-6]="!['professionals', 'branches', 'services'].includes(activeSection)"
                [class.p-0]="['professionals', 'branches', 'services'].includes(activeSection)">

                <!-- Portal de Reservas / Sitio Público -->
                <div *ngIf="activeSection === 'public-site'" class="h-full flex flex-col animate-in fade-in duration-500">
                    <!-- Sub-tabs navigation -->
                    <div class="flex border-b border-border pb-px gap-6 shrink-0 overflow-x-auto custom-scrollbar">
                        <button (click)="setActivePublicSubTab('general')"
                            [class.text-primary]="activePublicSubTab === 'general'"
                            [class.border-primary]="activePublicSubTab === 'general'"
                            class="pb-3 text-sm font-bold text-text-muted border-b-2 border-transparent transition-all hover:text-text-main flex items-center gap-2 whitespace-nowrap">
                            <app-icon name="store" class="text-sm"></app-icon>
                            <span class="md:hidden">Información</span>
                            <span class="hidden md:inline">Información General</span>
                        </button>
                        <button (click)="setActivePublicSubTab('appearance')"
                            [class.text-primary]="activePublicSubTab === 'appearance'"
                            [class.border-primary]="activePublicSubTab === 'appearance'"
                            class="pb-3 text-sm font-bold text-text-muted border-b-2 border-transparent transition-all hover:text-text-main flex items-center gap-2 whitespace-nowrap">
                            <app-icon name="palette" class="text-sm"></app-icon>
                            <span class="md:hidden">Apariencia</span>
                            <span class="hidden md:inline">Apariencia y Colores</span>
                        </button>
                        <button (click)="setActivePublicSubTab('booking')"
                            [class.text-primary]="activePublicSubTab === 'booking'"
                            [class.border-primary]="activePublicSubTab === 'booking'"
                            class="pb-3 text-sm font-bold text-text-muted border-b-2 border-transparent transition-all hover:text-text-main flex items-center gap-2 whitespace-nowrap">
                            <app-icon name="calendar_month" class="text-sm"></app-icon>
                            <span class="md:hidden">Reglas</span>
                            <span class="hidden md:inline">Reglas de Reserva</span>
                        </button>
                    </div>

                    <!-- Sub-tab contents -->
                    <div class="flex-1 overflow-y-auto custom-scrollbar pt-6">
                        <!-- General Info -->
                        <app-settings-general
                            *ngIf="activePublicSubTab === 'general'"
                            [form]="settingsForm"
                            [tenantId]="tenantId()"
                            [slugStatus]="slugStatus()"
                            [categoryConfig]="categoryConfig"
                            [categories]="categories"
                            (copyLink)="copyToClipboard()"
                            (visitPage)="visitPublicPage()"
                            (generateQR)="generateQR()">
                        </app-settings-general>

                        <!-- Appearance -->
                        <app-settings-appearance
                            *ngIf="activePublicSubTab === 'appearance'"
                            [form]="settingsForm"
                            [colorPresets]="colorPresets"
                            [activeTheme]="activeTheme()"
                            [showThemeSelector]="showThemeSelector()"
                            (applyPreset)="applyPreset($event)"
                            (toggleThemeSelector)="showThemeSelector.set(!showThemeSelector())"
                            (closeThemeSelector)="showThemeSelector.set(false)">
                        </app-settings-appearance>

                        <!-- Booking Rules -->
                        <app-settings-booking
                            *ngIf="activePublicSubTab === 'booking'"
                            [form]="settingsForm"
                            [anticipationMinConfig]="anticipationMinConfig"
                            [anticipationMinOptions]="anticipationMinOptions"
                            [anticipationMaxConfig]="anticipationMaxConfig"
                            [anticipationMaxOptions]="anticipationMaxOptions"
                            [overlapConfig]="overlapConfig"
                            [overlapOptions]="overlapOptions"
                            [cancellationConfig]="cancellationConfig"
                            [cancellationOptions]="cancellationOptions">
                        </app-settings-booking>
                    </div>
                </div>

                <!-- Notifications Section -->
                <app-settings-notifications
                    *ngIf="activeSection === 'notifications'"
                    [form]="settingsForm">
                </app-settings-notifications>

                <!-- Professionals Section -->
                <div *ngIf="activeSection === 'professionals'" class="animate-in fade-in duration-500">
                    <app-professionals-list></app-professionals-list>
                </div>

                <!-- Branches Section -->
                <div *ngIf="activeSection === 'branches'" class="animate-in fade-in duration-500">
                    <app-branches-list></app-branches-list>
                </div>

                <!-- Services Section -->
                <div *ngIf="activeSection === 'services'" class="animate-in fade-in duration-500">
                    <app-services-list></app-services-list>
                </div>

                <!-- Custom Fields Section -->
                <div *ngIf="activeSection === 'custom-fields'" class="animate-in fade-in duration-500">
                    <app-settings-custom-fields></app-settings-custom-fields>
                </div>

                <!-- Billing Section -->
                <app-settings-billing
                    *ngIf="activeSection === 'billing'">
                </app-settings-billing>

                <!-- WhatsApp Section -->
                <app-settings-whatsapp
                    *ngIf="activeSection === 'whatsapp'">
                </app-settings-whatsapp>

            </div>
        </main>
    </div>

    <!-- QR Modal Reutilizable -->
    <app-qr-dialog
        *ngIf="showQRModal()"
        [url]="'https://axenda.ar/' + settingsForm.get('publicSlug')?.value"
        (close)="showQRModal.set(false)">
    </app-qr-dialog>
</div>
