<div class="h-full flex flex-col p-2 md:p-4 overflow-hidden bg-bg-primary">
    <div class="mb-4 flex justify-between items-start">
        <div>
            <h1 class="text-2xl font-bold text-text-main tracking-tight">Configuración del Negocio</h1>
            <p class="text-text-muted text-sm mt-1">Gestiona los detalles y preferencias de tu negocio.</p>
        </div>
        <app-theme-toggle [showLabels]="true" />
    </div>

    <div class="flex-1 flex flex-col md:flex-row gap-4 overflow-hidden">
        <!-- Section Sidebar / Menu -->
        <aside class="w-full md:w-64 shrink-0 grid grid-cols-4 md:flex md:flex-col gap-2 md:gap-1 overflow-y-auto custom-scrollbar md:pr-2 pb-2 md:pb-0">
            <button
                *ngFor="let section of sections"
                (click)="setActiveSection(section.id)"
                [class.bg-surface-subtle-hover]="activeSection === section.id"
                [class.text-text-main]="activeSection === section.id"
                [class.border-b-4]="activeSection === section.id"
                [class.md:border-b-0]="activeSection === section.id"
                [class.md:border-l-4]="activeSection === section.id"
                [class.border-primary]="activeSection === section.id"
                class="flex flex-col md:flex-row items-center gap-1 md:gap-3 p-2 md:p-3 rounded-xl text-text-muted font-medium transition-all hover:bg-surface-subtle hover:text-text-main text-center md:text-left group border-b-4 md:border-b-0 md:border-l-4 border-transparent shrink-0">
                <app-icon name="{{ section.icon }}" class="text-base md:text-base transition-transform group-hover:scale-110"></app-icon>
                <div class="flex flex-col min-w-0">
                    <span class="font-bold truncate text-[10px] md:text-sm">{{ section.title }}</span>
                    <span class="text-[10px] opacity-60 truncate hidden md:block">{{ section.description }}</span>
                </div>
            </button>
        </aside>

        <!-- Content Area -->
        <main class="flex-1 glass rounded-2xl overflow-hidden flex flex-col border border-border">
            <div class="h-full overflow-y-auto custom-scrollbar"
                [class.p-4]="!['professionals', 'branches', 'services', 'appearance'].includes(activeSection)"
                [class.md:p-6]="!['professionals', 'branches', 'services', 'appearance'].includes(activeSection)"
                [class.p-0]="['professionals', 'branches', 'services'].includes(activeSection)"
                [class.p-6]="activeSection === 'appearance'">

                <!-- Business Info Section -->
                <app-settings-general
                    *ngIf="activeSection === 'business-info'"
                    [form]="settingsForm"
                    [tenantId]="tenantId()"
                    [slugStatus]="slugStatus()"
                    [categoryConfig]="categoryConfig"
                    [categories]="categories"
                    (copyLink)="copyToClipboard()"
                    (visitPage)="visitPublicPage()"
                    (generateQR)="generateQR()">
                </app-settings-general>

                <!-- Appearance Section -->
                <app-settings-appearance
                    *ngIf="activeSection === 'appearance'"
                    [form]="settingsForm"
                    [colorPresets]="colorPresets"
                    [activeTheme]="activeTheme()"
                    [showThemeSelector]="showThemeSelector()"
                    (applyPreset)="applyPreset($event)"
                    (toggleThemeSelector)="showThemeSelector.set(!showThemeSelector())"
                    (closeThemeSelector)="showThemeSelector.set(false)">
                </app-settings-appearance>

                <!-- Booking Settings Section -->
                <app-settings-booking
                    *ngIf="activeSection === 'booking-settings'"
                    [form]="settingsForm"
                    [anticipationMinConfig]="anticipationMinConfig"
                    [anticipationMinOptions]="anticipationMinOptions"
                    [anticipationMaxConfig]="anticipationMaxConfig"
                    [anticipationMaxOptions]="anticipationMaxOptions"
                    [overlapConfig]="overlapConfig"
                    [overlapOptions]="overlapOptions"
                    [cancellationConfig]="cancellationConfig"
                    [cancellationOptions]="cancellationOptions">
                </app-settings-booking>

                <!-- Notifications Section -->
                <app-settings-notifications
                    *ngIf="activeSection === 'notifications'"
                    [form]="settingsForm">
                </app-settings-notifications>

                <!-- Professionals Section -->
                <div *ngIf="activeSection === 'professionals'" class="animate-in fade-in duration-500">
                    <app-professionals-list></app-professionals-list>
                </div>

                <!-- Branches Section -->
                <div *ngIf="activeSection === 'branches'" class="animate-in fade-in duration-500">
                    <app-branches-list></app-branches-list>
                </div>

                <!-- Services Section -->
                <div *ngIf="activeSection === 'services'" class="animate-in fade-in duration-500">
                    <app-services-list></app-services-list>
                </div>

                <!-- Billing Section -->
                <app-settings-billing
                    *ngIf="activeSection === 'billing'">
                </app-settings-billing>

                <!-- WhatsApp Section -->
                <app-settings-whatsapp
                    *ngIf="activeSection === 'whatsapp'">
                </app-settings-whatsapp>

            </div>
        </main>
    </div>

    <!-- QR Modal Reutilizable -->
    <app-qr-dialog
        *ngIf="showQRModal()"
        [url]="'https://axenda.ar/' + settingsForm.get('publicSlug')?.value"
        (close)="showQRModal.set(false)">
    </app-qr-dialog>
</div>
