<div class="bg-bg-primary border border-white/10 rounded-2xl shadow-2xl overflow-hidden max-w-2xl w-full flex flex-col animate-in fade-in zoom-in duration-200">
  <!-- Header -->
  <header class="p-6 border-b border-white/10 bg-white/5 flex justify-between items-center">
    <div>
      <h2 class="text-xl font-bold text-text-main">
        {{ isEditMode() ? '📝 Editar Turno' : '📅 Agendar Nuevo Turno' }}
      </h2>
      <p class="text-xs text-text-dim mt-1">
        {{ isEditMode() ? 'Modifica los detalles del turno seleccionado' : 'Completa los detalles para reservar la cita' }}
      </p>
    </div>
    <button (click)="close()" class="p-2 hover:bg-white/10 rounded-xl transition-all text-text-dim hover:text-text-main">
      ✕
    </button>
  </header>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-6 space-y-6 overflow-y-auto max-h-[calc(100dvh-180px)] custom-scrollbar">
    
    <!-- Sección: Cliente -->
    <app-searchable-select 
      formControlName="clientId"
      [config]="clientConfig"
    ></app-searchable-select>

    <!-- Sección: Servicio y Profesional -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <app-select
        formControlName="serviceId"
        [options]="services()"
        [config]="serviceConfig"
      ></app-select>

      <app-searchable-select
        formControlName="professionalId"
        [config]="profConfig"
      ></app-searchable-select>
    </div>

    <!-- Sección: Fecha y Hora -->
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
      <div class="col-span-2 md:col-span-1 space-y-2">
        <label class="text-xs font-bold text-text-dim uppercase tracking-wider">Fecha</label>
        <input type="date" formControlName="date"
               class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-text-main focus:ring-2 focus:ring-primary/50 outline-none">
      </div>
      <!-- Horas en la misma fila -->
      <div class="col-span-2 md:col-span-2">
        <div class="flex gap-3">
          <div class="flex-1 space-y-2">
            <label class="text-xs font-bold text-text-dim uppercase tracking-wider">Hora Inicio</label>
            <input type="time" formControlName="time"
                   class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-text-main focus:ring-2 focus:ring-primary/50 outline-none">
          </div>
          <div class="flex-1 space-y-2">
            <label class="text-xs font-bold text-text-dim uppercase tracking-wider">Hora Fin</label>
            <input type="time" formControlName="endTime"
                   class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-text-main focus:ring-2 focus:ring-primary/50 outline-none">
          </div>
        </div>
      </div>
    </div>

    <!-- Notas -->
    <div class="space-y-2">
      <label class="text-xs font-bold text-text-dim uppercase tracking-wider">Notas del turno</label>
      <textarea formControlName="notes" 
                rows="2"
                placeholder="Ej: El cliente llega 5 min tarde..."
                class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-text-main focus:ring-2 focus:ring-primary/50 outline-none resize-none"></textarea>
    </div>

  </form>

  <!-- Footer -->
  <footer class="p-6 border-t border-white/10 bg-white/5 flex justify-end items-center gap-3">
    <button type="button" (click)="close()" 
            class="px-6 py-2 rounded-xl text-sm font-bold text-text-dim hover:bg-white/5 transition-all">
      Cancelar
    </button>
    <button (click)="onSubmit()" 
            [disabled]="isSubmitting()"
            class="px-8 py-2 rounded-xl bg-primary text-white text-sm font-bold shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-all disabled:opacity-50 disabled:hover:scale-100">
      @if (isSubmitting()) {
        <div class="flex items-center gap-2">
          <div class="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></div>
          <span>Agendando...</span>
        </div>
      } @else {
        <span>{{ isEditMode() ? 'Actualizar Turno' : 'Confirmar Turno' }}</span>
      }
    </button>
  </footer>
</div>
