<div class="p-3 sm:p-6 flex flex-col gap-6 h-full overflow-y-auto custom-scrollbar">
  <header class="flex justify-between items-center">
    <div class="header-info">
      <h1 class="text-3xl font-black mb-1 text-gradient">Sucursales</h1>
      <p class="text-xs text-text-muted">Gestiona tus sedes y puntos de atención.</p>
    </div>
    <div class="header-actions">
      <button (click)="openCreateForm()" class="btn-primary !px-4 !py-2.5 !text-sm flex items-center gap-2">
        <span class="material-symbols-rounded text-lg">add_location</span>
        Nueva Sucursal
      </button>
    </div>
  </header>

  <div class="search-box-container max-w-sm">
    <span class="material-symbols-rounded text-lg text-text-dim">search</span>
    <input
      type="text"
      [value]="searchTerm()"
      (input)="onSearchChange(search.value)"
      #search
      class="search-box-input"
      placeholder="Buscar sucursal...">
  </div>

  <div class="card-glass !p-0 overflow-hidden border-white/5">
    <app-data-table
      [data]="filteredBranches()"
      [columns]="['branch', 'contact', 'active', 'actions']"
      [headers]="['Sucursal', 'Contacto', 'Estado', 'Acciones']"
      density="compact">
      
      <ng-template appTableCell="branch" let-branch>
        <div class="flex items-center gap-3 py-1">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-600/20 to-primary/20 text-text-main flex items-center justify-center border border-indigo-500/20 shadow-lg">
            <span class="material-symbols-rounded text-lg text-indigo-400">location_on</span>
          </div>
          <div class="flex flex-col min-w-0">
            <span class="text-sm font-bold text-text-main truncate leading-tight">{{ branch.name }}</span>
            @if (branch.address) {
              <span class="text-[10px] text-text-dim truncate opacity-70">{{ branch.address }}</span>
            }
          </div>
        </div>
      </ng-template>

      <ng-template appTableCell="contact" let-branch>
        <span class="text-[12px] text-text-muted font-medium">{{ branch.phone || '-' }}</span>
      </ng-template>

      <ng-template appTableCell="active" let-branch>
        <span class="status-indicator" [class.active]="branch.active">
          {{ branch.active ? 'Activa' : 'Baja' }}
        </span>
      </ng-template>

      <ng-template appTableCell="actions" let-branch>
        <div class="row-actions">
          <button (click)="openEditForm(branch)" class="btn-icon-small" title="Editar">
            <span class="material-symbols-rounded text-lg">edit</span>
          </button>
          <button (click)="deleteBranch(branch.id)" class="btn-icon-small btn-icon-delete" title="Eliminar">
            <span class="material-symbols-rounded text-lg">delete</span>
          </button>
        </div>
      </ng-template>
    </app-data-table>

    @if (filteredBranches().length === 0 && !isLoading()) {
      <div class="empty-state py-12">
        <span class="material-symbols-rounded text-5xl mb-4 opacity-10">domain</span>
        <p class="text-sm">No se encontraron sucursales.</p>
      </div>
    }
  </div>
</div>
