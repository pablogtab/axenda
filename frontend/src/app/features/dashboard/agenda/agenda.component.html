<div class="flex flex-col h-full bg-bg-primary overflow-hidden">
  <!-- Header: Controles -->
  <header class="p-6 border-b border-white/10 bg-white/5 backdrop-blur-md flex justify-between items-center z-40">
    <div class="flex items-center gap-6">
      <h1 class="text-2xl font-bold text-text-main flex items-center gap-3">
        📅 Agenda
        <span class="text-sm font-normal text-text-dim px-3 py-1 rounded-full bg-white/5 border border-white/10">
          {{ formattedDate() }}
        </span>
      </h1>
      
      <!-- Navegación de Fecha -->
      <div class="flex items-center bg-white/5 rounded-xl border border-white/10 p-1">
        <button (click)="changeDate(-1)" class="p-2 hover:bg-white/10 rounded-lg transition-all text-text-dim hover:text-text-main">←</button>
        <button (click)="today()" class="px-4 py-2 hover:bg-white/10 rounded-lg text-sm font-bold transition-all text-text-main">Hoy</button>
        <button (click)="changeDate(1)" class="p-2 hover:bg-white/10 rounded-lg transition-all text-text-dim hover:text-text-main">→</button>
      </div>

      <!-- Selector de Vista -->
      <div class="flex items-center bg-white/5 rounded-xl border border-white/10 p-1 ml-2">
        <button (click)="setView('day')" 
                [class.bg-primary]="selectedView() === 'day'"
                [class.text-white]="selectedView() === 'day'"
                class="px-4 py-2 rounded-lg text-sm font-bold transition-all text-text-dim hover:text-text-main">
          Día
        </button>
        <button (click)="setView('week')" 
                [class.bg-primary]="selectedView() === 'week'"
                [class.text-white]="selectedView() === 'week'"
                class="px-4 py-2 rounded-lg text-sm font-bold transition-all text-text-dim hover:text-text-main">
          Semana
        </button>
      </div>
    </div>

    <div class="flex items-center gap-4">
      <select [ngModel]="selectedBranchId()" (ngModelChange)="onBranchChange($event)" 
              class="bg-white/5 border border-white/10 text-text-main rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-primary/50 outline-none">
        @for (branch of branches(); track branch.id) {
          <option [value]="branch.id">{{ branch.name }}</option>
        }
      </select>
      <button (click)="onAddAppointment({ professional: professionals()[0], time: '09:00' })" 
              class="bg-primary hover:bg-primary/90 text-white px-6 py-2 rounded-xl text-sm font-bold shadow-lg shadow-primary/20 transition-all hover:scale-[1.02] active:scale-[0.98]">
        + Nuevo Turno
      </button>
    </div>
  </header>

  <!-- Contenido de la Vista -->
  <div class="flex-1 overflow-hidden relative">
    @if (isLoading()) {
      <div class="absolute inset-0 bg-bg-primary/50 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="animate-spin h-10 w-10 border-4 border-primary border-t-transparent rounded-full"></div>
      </div>
    }

    @switch (selectedView()) {
      @case ('day') {
        <app-agenda-day-view 
          [date]="selectedDate()"
          [branchId]="selectedBranchId()"
          [professionals]="professionals()"
          (addAppointment)="onAddAppointment($event)"
          (editAppointment)="onEditAppointment($event)"
        ></app-agenda-day-view>
      }
      @case ('week') {
        <app-agenda-week-view
          [date]="selectedDate()"
          [branchId]="selectedBranchId()"
          [professionals]="professionals()"
        ></app-agenda-week-view>
      }
    }
  </div>
</div>
