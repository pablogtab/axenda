<div class="card-glass w-[550px] max-w-full !p-10">
  <header class="flex justify-between items-center mb-8">
    <h2 class="text-3xl font-bold text-text-main">{{ isEditing ? 'Editar Servicio' : 'Nuevo Servicio' }}</h2>
    <button class="text-3xl leading-none text-text-dim hover:text-red-500 transition-colors" (click)="onCancel()">×</button>
  </header>

  <form [formGroup]="serviceForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
    <div class="flex flex-col gap-2">
      <label for="name" class="text-sm font-semibold text-text-muted">Nombre del Servicio *</label>
      <input id="name" type="text" formControlName="name" class="input-field" placeholder="Ej: Corte de Cabello">
      @if (serviceForm.get('name')?.touched && serviceForm.get('name')?.invalid) {
        <span class="text-xs text-red-400">El nombre es obligatorio</span>
      }
    </div>

    <div class="grid grid-cols-2 gap-6">
      <div class="flex flex-col gap-2">
        <label for="duration" class="text-sm font-semibold text-text-muted">Duración (minutos) *</label>
        <input id="duration" type="number" formControlName="duration" class="input-field" step="5">
        @if (serviceForm.get('duration')?.touched && serviceForm.get('duration')?.invalid) {
          <span class="text-xs text-red-400">Mínimo 5 min</span>
        }
      </div>
      <div class="flex flex-col gap-2">
        <label for="price" class="text-sm font-semibold text-text-muted">Precio ($) *</label>
        <input id="price" type="number" formControlName="price" class="input-field">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-6">
      <div class="flex flex-col gap-2">
        <label for="categoryId" class="text-sm font-semibold text-text-muted">Categoría</label>
        <select id="categoryId" formControlName="categoryId" class="input-field">
          <option value="">Sin categoría</option>
          @for (cat of categories(); track cat.id) {
            <option [value]="cat.id">{{ cat.name }}</option>
          }
        </select>
      </div>
      <div class="flex flex-col gap-2">
        <label for="color" class="text-sm font-semibold text-text-muted">Color en Agenda</label>
        <div class="flex items-center gap-4 bg-bg-secondary p-2 rounded-xl border border-border">
          <input id="color" type="color" formControlName="color" class="w-10 h-10 bg-transparent border-none cursor-pointer">
          <span class="font-mono text-sm font-bold text-text-muted">{{ serviceForm.get('color')?.value }}</span>
        </div>
      </div>
    </div>

    <div class="flex flex-col gap-2">
      <label for="description" class="text-sm font-semibold text-text-muted">Descripción</label>
      <textarea id="description" formControlName="description" rows="2" class="input-field resize-none" placeholder="Breve descripción del servicio..."></textarea>
    </div>

    <div class="flex items-center gap-3 py-2">
      <input id="active" type="checkbox" formControlName="active" class="w-5 h-5 rounded border-white/10 bg-white/5 text-primary focus:ring-primary/20">
      <label for="active" class="text-sm font-medium text-text-muted cursor-pointer">Servicio activo</label>
    </div>

    <footer class="flex justify-end gap-4 mt-4">
      <button type="button" class="btn-secondary flex-1" (click)="onCancel()">Cancelar</button>
      <button type="submit" class="btn-primary flex-1" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Guardando...' : (isEditing ? 'Actualizar' : 'Crear Servicio') }}
      </button>
    </footer>
  </form>
</div>
