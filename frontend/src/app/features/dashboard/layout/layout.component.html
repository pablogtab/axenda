<div class="flex h-dvh bg-bg-primary overflow-hidden relative font-sans">
  <!-- Mobile Backdrop -->
  <div 
    *ngIf="!sidebarService.isCollapsed() && (sidebarService.isMobile())" 
    (click)="sidebarService.toggle()"
    class="fixed inset-0 bg-black/60 backdrop-blur-md z-[100] lg:hidden transition-opacity duration-500">
  </div>

  <!-- Sidebar -->
  <aside 
    [class.w-\[240px\]]="!sidebarService.isCollapsed()"
    [class.w-0]="sidebarService.isCollapsed()"
    [class.border-r-0]="sidebarService.isCollapsed()"
    [class.-translate-x-full]="sidebarService.isCollapsed() && sidebarService.isMobile()"
    class="flex flex-col border-r border-white/5 glass z-[110] transition-all duration-500 cubic-bezier-sidebar lg:translate-x-0 fixed lg:static h-full shrink-0 overflow-hidden"
    [class.p-4]="!sidebarService.isCollapsed()"
    [class.p-0]="sidebarService.isCollapsed()">
    
    <!-- Logo Section -->
    <div class="mb-8 px-2 flex items-center gap-0 overflow-hidden group cursor-pointer" routerLink="/dashboard/agenda">
      <div class="relative">
        <img src="assets/logo.svg" alt="Axenda Logo" class="w-10 h-10 shrink-0 transition-transform group-hover:scale-110 duration-500">
        <div class="absolute inset-0 bg-primary/20 blur-xl rounded-full scale-0 group-hover:scale-150 transition-transform duration-700"></div>
      </div>
      <h2 *ngIf="!sidebarService.isCollapsed()" class="text-3xl font-black tracking-tighter text-gradient whitespace-nowrap -ml-1 select-none">xenda</h2>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 flex flex-col gap-1.5 overflow-y-auto custom-scrollbar px-1">
      <div class="text-[10px] font-black text-text-dim uppercase tracking-[0.2em] mb-2 px-3 opacity-50" *ngIf="!sidebarService.isCollapsed()">Principal</div>
      
      <a routerLink="/dashboard/agenda" 
         routerLinkActive="active-nav-item" 
         class="nav-item group">
        <span class="material-symbols-rounded nav-icon">calendar_month</span>
        <span *ngIf="!sidebarService.isCollapsed()" class="nav-label">Agenda</span>
      </a>
      
      <div class="text-[10px] font-black text-text-dim uppercase tracking-[0.2em] mt-6 mb-2 px-3 opacity-50" *ngIf="!sidebarService.isCollapsed()">Gestión</div>

      <a routerLink="/dashboard/clients" 
         routerLinkActive="active-nav-item" 
         class="nav-item group">
        <span class="material-symbols-rounded nav-icon">group</span>
        <span *ngIf="!sidebarService.isCollapsed()" class="nav-label">Clientes</span>
      </a>

      <a [routerLink]="['/dashboard/settings']" [queryParams]="{section: 'professionals'}"
         routerLinkActive="active-nav-item" 
         class="nav-item group">
        <span class="material-symbols-rounded nav-icon">badge</span>
        <span *ngIf="!sidebarService.isCollapsed()" class="nav-label">Profesionales</span>
      </a>

      <a [routerLink]="['/dashboard/settings']" [queryParams]="{section: 'branches'}"
         routerLinkActive="active-nav-item" 
         class="nav-item group">
        <span class="material-symbols-rounded nav-icon">location_on</span>
        <span *ngIf="!sidebarService.isCollapsed()" class="nav-label">Sucursales</span>
      </a>

      <a [routerLink]="['/dashboard/settings']" [queryParams]="{section: 'services'}"
         routerLinkActive="active-nav-item" 
         class="nav-item group">
        <span class="material-symbols-rounded nav-icon">category</span>
        <span *ngIf="!sidebarService.isCollapsed()" class="nav-label">Servicios</span>
      </a>
      
      <div class="mt-auto pt-6">
        <a routerLink="/dashboard/settings" 
           routerLinkActive="active-nav-item" 
           class="nav-item group">
          <span class="material-symbols-rounded nav-icon">settings</span>
          <span *ngIf="!sidebarService.isCollapsed()" class="nav-label">Configuración</span>
        </a>
      </div>
    </nav>

    <!-- Logout Section -->
    <div class="mt-6 pt-4 border-t border-white/5">
      <button (click)="logout()" 
              class="w-full flex items-center gap-4 px-4 py-3 rounded-xl text-red-400/70 font-bold transition-all hover:bg-red-500/10 hover:text-red-400 group overflow-hidden">
        <span class="material-symbols-rounded text-xl transition-transform group-hover:-translate-x-1">logout</span> 
        <span *ngIf="!sidebarService.isCollapsed()" class="whitespace-nowrap text-sm">Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col min-w-0 relative bg-bg-main/50">
    <app-trial-banner />
    <!-- Mobile Header -->
    <header *ngIf="sidebarService.isMobile() && !isAgendaView()" class="flex items-center px-4 py-3 border-b border-white/5 glass shrink-0 z-50">
      <div class="flex items-center gap-3">
        <button (click)="sidebarService.toggle()" class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-white/5 text-text-main transition-colors">
          <span class="material-symbols-rounded">menu</span>
        </button>
        <div class="flex items-center gap-0" routerLink="/dashboard/agenda">
          <img src="assets/logo.svg" alt="Axenda Logo" class="w-7 h-7">
          <h2 class="text-xl font-black tracking-tighter text-gradient -ml-0.5">xenda</h2>
        </div>
      </div>
    </header>

    <!-- Content Area -->
    <div class="flex-1 overflow-hidden">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
