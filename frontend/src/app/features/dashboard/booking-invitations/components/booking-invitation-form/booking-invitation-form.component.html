<div class="card-glass w-[520px] max-w-full flex flex-col max-h-[90dvh] !p-0 overflow-hidden animate-in fade-in zoom-in duration-200">
  <header class="flex justify-between items-center px-10 pt-10 pb-6 shrink-0">
    <h2 class="text-3xl font-bold text-text-main">Nueva Invitación</h2>
    <button type="button" class="text-3xl leading-none text-text-dim hover:text-red-500 transition-colors" (click)="onCancel()">×</button>
  </header>

  <form (ngSubmit)="onSubmit()" class="flex-1 flex flex-col min-h-0 overflow-hidden">
    <div class="flex-1 overflow-y-auto custom-scrollbar px-10 pb-6 flex flex-col gap-6">

      <!-- 1. ¿Para quién? Sucursal, Profesional y Cliente (opcionales) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <app-select
          [options]="branches()"
          [config]="branchSelectConfig"
          [ngModel]="selectedBranchId()"
          (ngModelChange)="onBranchChange($event)"
          name="branchId">
        </app-select>
        <app-select
          [options]="filteredProfessionals()"
          [config]="professionalSelectConfig"
          [ngModel]="selectedProfessionalId()"
          (ngModelChange)="selectedProfessionalId.set($event)"
          name="professionalId">
        </app-select>
      </div>

      <!-- Cliente pre-asociado -->
      <div>
        <app-searchable-select
          [config]="clientSearchConfig"
          [ngModel]="selectedClientId()"
          (ngModelChange)="selectedClientId.set($event)"
          name="clientId">
        </app-searchable-select>
      </div>

      <!-- 2. ¿En qué período? Fecha inicio / fin -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="flex flex-col gap-2">
          <label for="startDate" class="text-sm font-semibold text-text-muted">Fecha de Inicio *</label>
          <input id="startDate" type="date" [ngModel]="startDate()" (ngModelChange)="startDate.set($event)" name="startDate" class="input-field" required>
        </div>
        <div class="flex flex-col gap-2">
          <label for="endDate" class="text-sm font-semibold text-text-muted">Fecha de Fin *</label>
          <input id="endDate" type="date" [ngModel]="endDate()" (ngModelChange)="endDate.set($event)" name="endDate" class="input-field" required>
        </div>
      </div>

      <!-- 3. ¿Qué días? -->
      <div class="flex flex-col gap-2">
        <label class="text-sm font-semibold text-text-muted">Días Permitidos</label>
        <div class="flex flex-wrap gap-2">
          <button type="button" *ngFor="let day of daysOfWeek"
                  (click)="toggleDay(day.value)"
                  [class.bg-primary]="isDaySelected(day.value)"
                  [class.text-white]="isDaySelected(day.value)"
                  [class.bg-surface-subtle]="!isDaySelected(day.value)"
                  [class.text-text-muted]="!isDaySelected(day.value)"
                  class="px-3.5 py-2 rounded-xl text-xs font-semibold hover:opacity-90 active:scale-95 transition-all select-none cursor-pointer">
            {{ day.label }}
          </button>
        </div>
      </div>

      <!-- 4. ¿En qué horario? -->
      <div class="grid grid-cols-2 gap-4">
        <app-time-input
          [ngModel]="startTime()"
          (ngModelChange)="startTime.set($event)"
          name="startTime"
          label="Hora de Inicio *">
        </app-time-input>
        <app-time-input
          [ngModel]="endTime()"
          (ngModelChange)="endTime.set($event)"
          name="endTime"
          label="Hora de Fin *">
        </app-time-input>
      </div>

      <!-- 5. Límites del link -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="flex flex-col gap-2">
          <label for="maxUses" class="text-sm font-semibold text-text-muted">Límite de usos</label>
          <input id="maxUses" type="number" [ngModel]="maxUses()" (ngModelChange)="maxUses.set($event)" name="maxUses" placeholder="Sin límite" min="1" class="input-field">
        </div>
        <div class="flex flex-col gap-2">
          <label for="expiresAt" class="text-sm font-semibold text-text-muted">Expira el (Enlace)</label>
          <input id="expiresAt" type="datetime-local" [ngModel]="expiresAt()" (ngModelChange)="expiresAt.set($event)" name="expiresAt" class="input-field">
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <footer class="flex justify-end gap-4 px-10 py-6 border-t border-border bg-surface-subtle/30 shrink-0">
      <button type="button" class="btn-secondary flex-1" (click)="onCancel()">Cancelar</button>
      <button type="submit" class="btn-primary flex-1" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Guardando...' : 'Crear Link' }}
      </button>
    </footer>
  </form>
</div>
