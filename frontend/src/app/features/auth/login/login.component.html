<div class="login-container">
  <div class="login-card glass">
    <div class="login-header">
      <h1 class="text-gradient">Axenda</h1>
      <p>Gestión profesional de turnos</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="input-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          placeholder="admin@axenda.com"
          [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        >
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password" 
          placeholder="••••••••"
          [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        >
      </div>

      <div *ngIf="errorMessage" class="error-alert">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn btn-primary w-full" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="!isLoading">Iniciar Sesión</span>
        <span *ngIf="isLoading" class="loader"></span>
      </button>
    </form>

    <div class="login-footer">
      <p>¿No tienes cuenta? <a href="#">Contáctanos</a></p>
    </div>
  </div>

  <!-- Decoración de fondo -->
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>
</div>
