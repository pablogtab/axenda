server {
    listen 80;
    
    # Directorio donde están los archivos compilados de Angular
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Compresión Gzip para mejor performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        # Esto es vital para que las rutas de Angular (SPA) funcionen
        try_files $uri $uri/ /index.html;
        
        # Evitar el cacheo del index.html para que el móvil siempre tenga los hashes nuevos
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Configuración para archivos estáticos con hash
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        # Si el archivo no existe, devolver 404 en lugar de index.html
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Mantener caché para assets en subcarpeta (si se usa)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
