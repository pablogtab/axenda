<table class="w-full border-collapse text-left bg-transparent">
  <thead>
    <tr class="bg-white/[0.02] border-b border-white/10">
      @for (header of headers(); track $index) {
        <th class="px-6 py-4 text-[0.75rem] font-bold text-text-dim uppercase tracking-widest">
          {{ header }}
        </th>
      }
    </tr>
  </thead>
  <tbody class="divide-y divide-white/[0.05]">
    @for (item of data(); track $index) {
      <tr class="transition-colors hover:bg-white/[0.03] group">
        @for (column of columns(); track column) {
          <td class="px-6 py-4 align-middle text-text-main">
            @if (getTemplateForColumn(column)) {
              <ng-container [ngTemplateOutlet]="getTemplateForColumn(column)!" [ngTemplateOutletContext]="{ $implicit: item }"></ng-container>
            } @else {
              {{ item[column] }}
            }
          </td>
        }
      </tr>
    }
  </tbody>
</table>
